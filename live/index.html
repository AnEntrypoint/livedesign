<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Live HMR</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <style>.status[data-state='failed'] { color: var(--bad); border-color: var(--bad); }</style>
</head>
<body>
  <header class="bar">
    <div class="pills">
      <div id="status" class="status" data-state="idle" role="status">idle</div>
      <div id="app-status" class="status" data-state="no_page" role="status">app: no_page</div>
    </div>
    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="share" type="button" disabled>Share this tab</button>
      <button id="mute" type="button" disabled aria-pressed="false">Mute mic</button>
      <button id="refresh" type="button">Refresh page</button>
      <button id="pause" type="button" aria-pressed="false">Pause edits</button>
      <button id="restore" type="button">Restore last good</button>
      <button id="rebuild" type="button">Rebuild frame</button>
      <button id="stop" type="button" disabled>Stop</button>
      <a id="open-app" href="/app/" target="_blank" rel="noopener">Open app in its own tab</a>
    </div>
  </header>
  <main class="stage">
    <iframe id="frame" name="hmr-live-frame" title="App under edit"></iframe>
    <aside class="side">
      <ol id="log" class="log" aria-label="Session log"></ol>
      <form id="say" class="say">
        <input id="say-text" type="text" autocomplete="off" placeholder="Type to Gemini" aria-label="Message to Gemini" disabled>
        <button id="say-send" type="submit" disabled>Send</button>
      </form>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
