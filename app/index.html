    (() => {
      const loads = Number(sessionStorage.getItem('app-loads') || 0) + 1;
      sessionStorage.setItem('app-loads', String(loads));
      document.documentElement.dataset.loads = String(loads);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <p id="page-loads" data-hmr-chrome class="fixed right-3 bottom-3 rounded-md border bg-card px-2 py-1 text-xs text-muted-foreground"></p>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
